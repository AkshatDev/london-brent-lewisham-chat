# Field facts for the chat bot, Lewisham only (golden rule). Describes the data after cleaning.yaml.
field: borough
web_label: Borough
meaning: >
  The borough the Datahub files the record under. After cleaning it is always Lewisham.
  It names the authority that recorded the record, which is not always where the site
  is (see consultation_responses).
schema_definition: Describes the name of the Borough
format: text

values:
  - Lewisham

checks_passed:
  - Every value is a string, exactly "Lewisham"; no case or spacing variants.
  - Every record has a borough after cleaning (the 452 without one are empty records,
    dropped at load).
  - No record decided by Lewisham is filed under another borough.
  - No other borough or authority name in the Datahub contains "Lewisham" (155 borough
    and 36 authority names checked), so the exact-match scope filter misses nothing.

known_issues:
  - id: consultation_responses
    description: >
      Some records with borough Lewisham are Lewisham's response when another
      authority consulted it; their site is in that authority's area. Confirmed ones
      are dropped (cleaning.yaml, drop_consultation_responses); others may remain
      (sources.yaml, consultation_responses).

rules:
  - '"Which borough?" is always Lewisham here; borough is not a way to split Lewisham up
    (use address for places within Lewisham).'
  - Who decided is lpa_name, not borough.
  - Don't take borough as proof that the site is in Lewisham; no boundary check has
    been made for Lewisham records.

checked:
  date: 2026-11-11
  source: live API (findings/lewisham/borough.ipynb, Steps 1-3; findings/lewisham/out_of_borough.ipynb)
