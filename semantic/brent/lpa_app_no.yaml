# Field facts for the chat bot, Brent only (golden rule). Describes the data after cleaning.yaml.
field: lpa_app_no
web_label: LPA Number
meaning: >
  The planning application reference given by the local planning authority (e.g.
  18/1022), as people quote it. The record id is the authority name plus this reference
  (e.g. Brent-18_1022).
schema_definition: Describes the reference number assigned by the Local Planning Authority
format: text

checks_passed:
  - Every record has one; every value is a string.
  - Unique after cleaning (the only repeats were the 4 Brent/OPDC duplicates, dropped
    by drop_opdc_duplicates in cleaning.yaml; Brent's portal confirms Brent decided
    them).
  - No 55/ references: all 8 are test records, dropped at load.

rules:
  - '"Tell me about 18/1022" is a lookup on lpa_app_no; it returns at most one record.'
  - Use lpa_app_no, not id, when showing a reference to people.

checked:
  date: 2026-11-10
  source: live API; recounted on the cleaned database (core.applications)
