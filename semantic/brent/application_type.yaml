# Field facts for the chat bot, Brent only (golden rule). Describes the data after cleaning.yaml.
field: application_type
web_label: Application type
meaning: >
  The broad kind of application, in 3 groups. It is not the outcome: the outcome is
  in decision.
schema_definition: Describes the generic Application Type, see Field Values tab for all Application Types
format: text

# Values after cleaning (2026-11-10 snapshot).
values:
  - All Other        # 23,043
  - Householder      # 9,409
  - Prior Approval   # 4,079

checks_passed:
  - Every record has a value, all values are schema values, no case or whitespace variants.

rules:
  - Prior Approval is a kind of application, not an outcome; about a third are refused
    (1,286 of 4,079). Use decision for the outcome. On Brent's portal the outcome reads
    "Prior approval required, GTD" (granted, = Approved) or "... REF" (refused, =
    Refused).
  - Only these 3 groups are known; more specific types (e.g. change of use, listed
    building consent) can't be answered from this field.

checked:
  date: 2026-11-10
  source: live API; recounted on the cleaned database (core.applications)
