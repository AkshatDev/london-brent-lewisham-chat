  - id: outcome_from_portal
    action: set_outcome
    only_when_null: [status, decision]
    sets: [status, decision]
    source: portal_manual_check
    expected_count: 2
    decided: 2026-11-11
    reason: >
      These records have a decision_date but no status and no decision. Lewisham's
      planning portal (checked by a person, 2026-11-11) shows each as Decided,
      "Granted Deemed Consent", with the Decision Issued Date equal to our
      decision_date. "Granted Deemed Consent" is not a schema value and no Lewisham
      record uses "deemed"; it is loaded as Approved, a permission to go ahead
      (findings/lewisham/application_type.ipynb, Step 1). Applied only while the
      Datahub still has both fields empty. DC/21/122223, DC/26/143311 and
      DC/24/138293 are Unknown on the portal too, so they stay Unknown
      (empty_to_unknown).
    outcomes:
