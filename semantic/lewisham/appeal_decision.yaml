# Field facts for the chat bot, Lewisham only (golden rule). Describes the data after cleaning.yaml.
field: appeal_decision
web_label: Appeal decision
meaning: >
  Outcome of an appeal against the council's decision, decided by the Planning
  Inspectorate. Unlike status, it stays when the application moves on. Null means no
  appeal was decided (most applications are never appealed).
schema_definition: >
  Describes the decision of the appeal made by the planning inspectorate, see Field
  Values tab for all appeal decision types
format: text

# Values after cleaning (live API, 2026-11-11), most common first.
values:
  - Dismissed
  - Allowed
  - Withdrawn
  - Split Decision
values_not_in_schema: []

schema_values_never_seen:
  - Appeal In Progress
  - Quashed
  - Appeal Closed

checks_passed:
  - Every filled value is a string; no case or whitespace variants.
  - Always filled together with appeal_decision_date.
  - Never contradicts status (status Allowed / Dismissed / Split Decision always has the
    same appeal_decision).

known_issues:
  - id: allowed_status_moved_on
    count: 135
    description: >
      135 of the 275 allowed appeals no longer show it in status (now Completed 77,
      Lapsed 33, Superseded 23, Commenced 2). Dismissed appeals keep status Dismissed.

  - id: withdrawn_appeal
    count: 16
    description: >
      A withdrawn appeal leaves the council's decision standing (13 Refused, 3
      Approved). All 16 have status Withdrawn, so status Withdrawn does not always mean
      the application was withdrawn (decision.yaml, withdrawn_appeal_in_status).

  - id: appeal_after_approval
    count: 5
    description: >
      Appeals Dismissed (3) or Allowed (2) against a decision Approved. Why (e.g.
      against conditions) is not checked.

rules:
  - '"How many appeals were allowed / dismissed?" uses appeal_decision, not status.'
  - Appeals still running are not here; they show in status (Appeal Received, Appeal
    In Progress).
  - The council's original decision is in decision; appeal_decision does not change it.
  - '"How many applications were withdrawn?" is not answered from here: Withdrawn here
    is a withdrawn appeal.'

checked:
  date: 2026-11-11
  source: live API (findings/lewisham/appeal_decision.ipynb, Steps 1-4)
