# Load-time cleaning, Brent only (golden rule). Not chat bot context: the field
# files describe the data as it is after these rules.
# Applied in this order: all_records, fields, derived; then the not_loaded fields
# are left out of the cleaned database (they stay in the local raw snapshots).
# Actions: strip, drop_records, map, replace, fill_null, flag, to_text, derive.

all_records:
  - id: strip_whitespace
    action: strip
    applies_to: all_text_fields
    decided: 2026-11-09
    reason: >
      Leading/trailing whitespace hides values from exact matches, e.g. decision
      "\tApproved" (3 records, a hidden tab).

  - id: blank_to_null
    action: fill_null
    applies_to: all_text_fields
    decided: 2026-11-10
    reason: >
      After stripping, an empty text means nothing was recorded; NULL is the one way
      "missing" is written, so the bot never has to check for both. Affects ward (9),
      street_name (5), postcode (4), site_name (2), secondary_street_name (1).

  - id: drop_test_records
    action: drop_records
    reference_prefix: "55/"   # an unlisted reference with this start is a new test record
    decided: 2026-11-09
    updated: 2026-11-10
    reason: >
      Test records, not real applications ("*** TEST APPLICATION ***", "Test
      application record for system monitoring", site "Test location"). Every 55/
      reference in Brent is one of these 8 (open question 6, answered 2026-11-10);
      the first list had only 3 and let 5 tests through as pending applications.
      A new 55/ reference on a later download stops the load for a look.
    ids:
      - Brent-55_0003
      - Brent-55_0015
      - Brent-55_0016
      - Brent-55_0100
      - Brent-55_0200
      - Brent-55_5561
      - Brent-55_5562
      - Brent-55_5563

  - id: drop_empty_records
    action: drop_records
    when_all_null: [status, decision, decision_date, description]
    expected_count: 407
    decided: 2026-11-09
    reason: >
      Empty records: no status, decision, decision_date or description (also no
      borough, URL or ward). Nothing in them can answer a question. 24 of them
      duplicate a full record, which is kept. The condition matches exactly these 407
      (live API 2026-11-09); a different count on a new download needs a look.

  - id: drop_opdc_duplicates
    action: drop_records
    decided: 2026-11-10
    reason: >
      The same 4 applications are recorded twice, under Brent and OPDC (same
      lpa_app_no, description, decision and decision_date). The Brent copy is kept: it
      has valid_date, decision_target_date and the planning portal URL, and comes with
      the regular feed. The OPDC copies are legacy imports with nothing the Brent copy
      lacks. Their status (Lapsed) differs for 3 pairs (open question 5).
    ids:
      - OPDC-18_1022
      - OPDC-18_2581
      - OPDC-19_2236
      - OPDC-19_2890

  - id: drop_outside_borough
    action: drop_records
    decided: 2026-11-10
    reason: >
      borough says Brent, but the site is in Hammersmith & Fulham: decided by H&F, ward
      COLLP (College Park & Old Oak, an H&F ward), postcode NW10 5NH in H&F
      (postcodes.io), and the centroid 12 m outside the ONS Brent boundary. Scope is by
      location (golden rule; open question 10, answered 2026-11-10).
    ids:
      - Hammersmith_&_Fulham-2025_01931_FUL
      - Hammersmith_&_Fulham-2025_01998_PMA56

  - id: outcome_from_portal
    action: set_outcome
    only_when_null: [status, decision]
    sets: [status, decision]
    source: portal_manual_check
    expected_count: 9
    decided: 2026-11-10
    reason: >
      These records have a decision_date but no status and no decision. Brent's
      planning portal (checked by a person, 2026-11-10) shows each as Decided, with
      the Decision Issued Date equal to our decision_date. status and decision are
      both set to the outcome, as for other decided records; outcome_source marks
      them. GTD = granted, REF = refused. Applied only while the Datahub still has both
      fields empty: if it fills them, the count changes and the load stops for a
      look. Brent-18_3324 is Decided on the portal with no decision, so it stays
      Unknown (open question 9, answered).
    outcomes:
      Brent-17_5180: Refused   # portal: Refuse Planning Permission
      Brent-18_0025: Approved   # portal: Grant Permission
      Brent-18_0037: Approved   # portal: Grant Permission
      Brent-18_0089: Approved   # portal: Grant Permission
      Brent-18_0129: Refused   # portal: Refuse Planning Permission
      Brent-18_0557: Refused   # portal: Prior approval required, REF -not lawful
      Brent-18_2109: Approved   # portal: Prior approval required, GTD -not lawful
      Brent-19_1286: Approved   # portal: Prior approval required, GTD -not lawful
      Brent-23_2560: Refused   # portal: Prior approval required, REF -not lawful

  - id: stale_outcome_from_portal
    action: set_outcome
    only_when_status: [Application Received, Application Under Consideration]
    source: portal_manual_check
    expected_count: 2
    decided: 2026-11-10
    reason: >
      Records still pending in the Datahub long after their target date
      (status_stale), whose real outcome a person read on Brent's planning portal
      (2026-11-10). Applied only while the Datahub still shows them pending. Add a
      line here for each further record checked (knowledge/brent_portal_checks.md,
      question 5).
    outcomes:
      Brent-23_0650: {status: Approved, decision: Approved, decision_date: 21/04/2023}   # portal: Prior approval required and approved
      Brent-20_4264: {status: Allowed, appeal_decision: Allowed}   # portal: Appeal decided, Appeal Allowed; no council decision shown

  - id: deleted_appeal
    action: set_when
    when: {status: ZZZ, appeal_decision: ZZZ, decision: Refused}
    set: {status: Refused, appeal_decision: null, appeal_decision_date: null}
    flag: appeal_record_deleted
    expected_count: 16
    decided: 2026-11-10
    reason: >
      ZZZ is not an outcome: on Brent's planning portal the Appeal Decision of these
      records is "Technically Deleted Record" (checked by a person on Brent-18_0301,
      Brent-22_2833, Brent-25_1656, 2026-11-10), i.e. the appeal record was deleted.
      The council's refusal stands, so status is Refused as for any refused
      application without an appeal; the deleted appeal's decision and date are
      removed, and appeal_record_deleted = true keeps the trace. Matched by value, so
      a new deleted appeal is handled too; the expected count catches a change
      (open question 2, answered).

fields:
  status:
    - id: lapsed_case
      action: map
      from: lapsed
      to: Lapsed
      decided: 2026-11-09
      reason: Lower-case variant of the schema value (37 records).

    - id: appeal_in_progress_case
      action: map
      from: Appeal in Progress
      to: Appeal In Progress
      decided: 2026-11-09
      reason: Case variant of the schema value (2 records).

    - id: empty_to_unknown
      action: fill_null
      to: Unknown
      decided: 2026-11-09
      reason: No status recorded; Unknown is a schema value.

  decision_date:
    - id: early_1987_approximate
      action: flag
      flag: approximate_decision_date
      decided: 2026-11-09
      reason: >
        Month-only legacy dates (01/01-01/04/1987, 24 of 25 on the 1st of a month),
        before the oldest valid_date in Brent (23/04/1987).
      ids:
        - Brent-861288
        - Brent-861442
        - Brent-861727
        - Brent-862186
        - Brent-862382
        - Brent-862390
        - Brent-DY850076
        - Brent-DY860443
        - Brent-DY860529
        - Brent-DY860530
        - Brent-DY860634
        - Brent-DY860635
        - Brent-DY861916
        - Brent-DY862014
        - Brent-DY862029
        - Brent-DY862100
        - Brent-DY862124
        - Brent-DY862259
        - Brent-DY862413
        - Brent-DY862414
        - Brent-DY862472
        - Brent-DY862478
        - Brent-DY870003
        - Brent-DY870124
        - Brent-DY870386

  url_planning_app:
    - id: url_space_to_hyphen
      action: replace
      from: /online applications/
      to: /online-applications/
      expected_count: 2
      decided: 2026-11-10
      reason: >
        2 URLs (Brent-21_4321, Brent-87_0946) have a space where every other URL
        (32,909) has a hyphen, so the link is broken. The hyphenated link for
        Brent-21_4321 returns the page (HTTP 200, checked 2026-11-10).

  site_number:
    - id: site_number_as_text
      action: to_text
      decided: 2026-11-10
      reason: >
        The schema type is string, but 1,624 values come as JSON numbers (all whole
        numbers). Store every value as text, numbers without a decimal part (2 -> "2"),
        so 2 and "2" are the same value.

derived:
  - id: address
    action: derive
    columns: [address, address_kind]
    from: [site_name, site_number, street_name, locality, postcode]
    decided: 2026-11-10
    address_kind: >
      Sort the stripped site_name into one kind, in this order:
      missing (null or blank);
      number_only (only a house number, letter or range, e.g. 2, 24A, 85-91);
      street_record (starts with "Street Record");
      with_full_postcode (contains a full UK postcode, e.g. HA0 2AA);
      several_parts (contains a comma, no full postcode);
      one_part (everything else).
    address: >
      with_full_postcode, several_parts, street_record: address = site_name.
      number_only, one_part, missing: join site_name, site_number (only if different
      from site_name), street_name, locality and postcode with ", ", skipping empty
      parts. Trim spaces and stray commas from each part first (locality has
      "London," and ", Wembley").
    reason: >
      site_name is a full address for 84% of records; for about 7.8% (number only,
      one part, missing) the other address fields complete it, and they are almost
      always there. One column means the bot can't pick the wrong field.

  - id: legacy_record
    action: derive
    columns: [legacy_record]
    from: [bo_system]
    when_equals: {bo_system: FME Legacy Data Import}   # read by clean_record
    decided: 2026-11-10
    rule: legacy_record = true when bo_system is "FME Legacy Data Import", else false.
    reason: >
      Legacy records never have valid_date, decision_target_date or url_planning_app
      (3,528 after cleaning, none has one). bo_system itself is not a web column; this
      flag lets the bot explain the empty fields instead of treating them as gaps.

  - id: decision_not_issued
    action: derive
    columns: [decision_not_issued]
    from: [status, decision, decision_date]
    when_status: [Application Received, Application Under Consideration]
    expected_count: 2
    decided: 2026-11-10
    rule: >
      decision_not_issued = true when status is one of when_status, decision is set
      and decision_date is empty; else false. decision is kept as the Datahub gives it.
    reason: >
      Brent-25_3290 and Brent-26_1174 say decision Approved, but Brent's planning
      portal shows both "Awaiting decision", subject to a Section 106 agreement not yet
      signed (25/3290 went to committee 18/08/2026; checked by a person 2026-11-10).
      The decision was recorded early; the application is not decided (open question
      4). The 4 other pending applications awaiting an S106 have no decision.

  - id: status_stale
    action: derive
    columns: [status_stale]
    from: [status, decision_date, decision_target_date]
    when_status: [Application Received, Application Under Consideration]
    stale_after_days: 365
    decided: 2026-11-10
    rule: >
      status_stale = true when status is one of when_status, decision_date is empty
      and decision_target_date is more than stale_after_days before the snapshot
      date; or the record is listed in ids. Computed at load (it depends on the
      snapshot date), after the portal outcomes; 34 on the 2026-11-10 snapshot
      (33 by date, 1 listed).
    ids:
      - Brent-96_1985   # 1996, "Appeal In Progress"; Brent's portal also still says "Appeal lodged", no appeal decision, 0 documents (checked by a person 2026-11-10)
    reason: >
      The Datahub stops updating some applications: 32 of the 35 found had not been
      updated for over a year, and the 3 checked on the portal had moved on
      (approved; appeal allowed; page removed). The bot must not report them as
      pending (open question 5).

not_loaded:
  - field: site_name
    reason: Combined into address.
  - field: site_number
    reason: Combined into address.
  - field: street_name
    reason: Combined into address.
  - field: locality
    reason: Combined into address.
  - field: postcode
    reason: Combined into address.
