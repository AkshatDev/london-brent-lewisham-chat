      other stopped being updated (mostly 2025-05-12) and 70 of them still say
      Application Under Consideration. The older copy is dropped, the current one kept,
      as with Brent's drop_opdc_duplicates. The "DC/" prefix does not tell which copy is
      current; last_updated does (findings/lewisham/url_planning_app.ipynb, Steps 2-4).
      DC/20/116497 / 20/116497 disagreed (Withdrawn / Approved); Lewisham's portal shows
      reference 20/116497, Granted 10/06/2020 (checked by a person 2026-11-11), so
