# Field facts for the chat bot, Brent only (golden rule). Describes the data after cleaning.yaml.
# The true/false columns that mark records whose values need care, and the column that
# says where an outcome came from. Every flag is set by a rule in cleaning.yaml.
field: record_flags
web_label: null   # derived; not on the website
meaning: >
  Columns of core.applications that tell the bot a value is approximate, corrected,
  recorded early or probably out of date. Counts are for the 2026-11-10 snapshot.

flags:
  outcome_source:
    format: text
    values:
      datahub: The outcome (status, decision, dates) is as the Datahub gives it (36,520).
      portal_manual_check: >
        A person read the outcome on Brent's planning portal on 2026-11-10 because the
        Datahub had none or an out-of-date one (11: 9 with no status or decision, 2
        stale pending records). Rules outcome_from_portal and stale_outcome_from_portal.
    bot_rule: Count these like any other outcome; cite the portal check (sources.yaml).

  appeal_record_deleted:
    format: boolean
    count: 16
    meaning: >
      The Datahub sent status and appeal_decision ZZZ: Brent's portal shows the appeal
      record as "Technically Deleted Record". Loaded as status Refused (the council's
      refusal stands), appeal_decision and appeal_decision_date NULL. Rule deleted_appeal.
    bot_rule: Not an appeal; never count it in appeal figures. If asked, say an appeal
      was entered and later deleted.

  decision_not_issued:
    format: boolean
    count: 2
    meaning: >
      A decision is recorded but the application is still pending, with no decision
      date (Brent-25_3290, Brent-26_1174: portal "Awaiting decision", Section 106
      agreement not yet signed). decision is kept as the Datahub gives it.
      Rule decision_not_issued.
    bot_rule: Treat as not decided yet; leave out of approval / refusal counts; say the
      Datahub records the decision early, likely subject to a legal agreement.

  status_stale:
    format: boolean
    count: 34
    meaning: >
      The status is probably out of date: still Application Received / Under
      Consideration with no decision date more than a year after the target date (33),
      or listed after a portal check (Brent-96_1985: "Appeal In Progress" since 1996,
      Brent's own portal still says "Appeal lodged"). Rule status_stale, computed at
      load from the snapshot date.
    bot_rule: Don't report or count as pending; say the record hasn't been updated and
      give url_planning_app.

  approximate_decision_date:
    format: boolean
    count: 25
    meaning: >
      Legacy records from early 1987 with month-only decision dates (24 of 25 on the
      1st). Rule early_1987_approximate.
    bot_rule: Give the month only ("about March 1987").

  legacy_record:
    see: legacy_record.yaml

  placeholder_centroid:
    see: location.yaml

rules:
  - Default counts of decided applications leave out decision_not_issued; default
    counts of pending applications leave out status_stale.
  - Appeal counts leave out appeal_record_deleted (they have no appeal_decision, so a
    count on appeal_decision does this by itself).
  - When a flag is true and the answer depends on that value, say so in the answer.

checked:
  date: 2026-11-10
  source: cleaned database (core.applications), snapshot 2026-11-10
