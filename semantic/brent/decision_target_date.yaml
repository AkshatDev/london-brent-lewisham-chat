# Field facts for the chat bot, Brent only (golden rule). Describes the data after cleaning.yaml.
field: decision_target_date
web_label: Decision target date
meaning: >
  The date by which the authority aims to decide the application, as recorded. Always
  on or after the valid date. In Brent it is usually 7 weeks after the valid date for
  All Other, 6 weeks for Householder and 5 weeks for Prior Approval.
schema_definition: Contains the decision target date for the application (DD/MM/YYYY)
format: date   # a real date in the database; the Datahub sends DD/MM/YYYY text

checks_passed:
  - All filled values are valid DD/MM/YYYY dates (no blanks, no other characters).
  - No placeholder dates (the most common date is used 45 times).
  - No record has a target date without a valid_date.

known_issues:
  - id: missing_target_date
    count: 3614
    description: >
      Legacy records (legacy_record = true, 3,528) never have a target date. The other
      86 are real gaps (74 of them also have no valid_date).

  - id: starts_2018
    description: >
      Target dates exist from 24/01/2018 on only (about 3,200-4,400 a year); older
      applications have none.

  - id: overdue_without_decision
    count: 33
    description: >
      Open applications (Application Received / Under Consideration, no
      decision_date) more than a year past their target date are flagged
      status_stale = true: the Datahub stopped updating them, and those checked on
      Brent's portal had moved on (record_flags.yaml; open question 5).

rules:
  - '"Was it decided on time?" compares decision_date with decision_target_date; only
    where both exist, so from 2018 on.'
  - A target date in the future is normal for applications not decided yet.
  - Use the recorded target date; never work it out from valid_date with the
    statutory 8 or 13 weeks.
  - An application with status_stale = true is not pending. Say its status is
    probably out of date and give url_planning_app.

checked:
  date: 2026-11-10
  source: live API; recounted on the cleaned database (core.applications)
