# Cleaning of each live record, Lewisham only (golden rule). Not chat bot context: the
# field files describe the data as it is after these rules.
# Applied in this order: all_records, then fields, then derived.
# Actions: strip, fill_null, drop_records, set_outcome, map, copy_when_null, to_text,
# derive.
# Rules are added field by field as the Lewisham EDA goes on (findings/lewisham/).

all_records:
  - id: strip_whitespace
    action: strip
    applies_to: all_text_fields
    decided: 2026-11-11
    reason: >
      Same as Brent: leading/trailing whitespace hides values from exact matches.
      How many Lewisham values it changes is not measured.

  - id: blank_to_null
    action: fill_null
    applies_to: all_text_fields
    decided: 2026-11-11
    reason: >
      Same as Brent: after stripping, an empty text means nothing was recorded, so
      "missing" is written one way only. The empty-record count below treats empty
      text as missing, so it relies on this rule.

  - id: drop_test_records
    action: drop_records
    reference_prefix: TEST   # an unlisted reference with this start is a new test record
    decided: 2026-11-11
    reason: >
      Test records, not real applications ("TEST DESCRIPTION", "Test Test", "TEST CASE
      NOT A LIVE CASE", "This is test data to produce a draft Decison Notice", a
      template with "[insert relevant legislation]"), although they carry real Lewisham
      addresses and portal URLs. Every TEST reference in Lewisham is one of these 6
      (findings/lewisham/decision.ipynb, Steps 8-9). Same rule as Brent's (there the
      marker is 55/). A new TEST reference should stop the load for a look; clean_record
      checks only 55/ today (handover).
    ids:
      - Lewisham-TEST_13_022223_X
      - Lewisham-TEST_18_022222
      - Lewisham-TEST_22_022222
      - Lewisham-TEST_22_022223
      - Lewisham-TEST_69_022223
      - Lewisham-TEST_80_022222_X

  - id: drop_empty_records
    action: drop_records
    when_all_null: [status, decision, decision_date, description]
    expected_count: 1151
    decided: 2026-11-11
    reason: >
      Empty records: no status, decision, decision_date or description (1,150 also
      have no URL). Nothing in them can answer a question. Same condition as Brent's
      rule; unlike Brent, most have a borough (only 452 of the 1,151 have none).
      Live API 2026-11-11 (findings/lewisham/status.ipynb, Step 2).

  - id: drop_portal_removed
    action: drop_records
    decided: 2026-11-11
    reason: >
      No outcome in the Datahub, and Lewisham's planning portal shows the page as
      "removed or restricted from public viewing" (checked by a person 2026-11-11,
      knowledge/lewisham_portal_checks.md). Asked about by id, the bot explains the
      exclusion (sources.yaml, portal_removed).
    ids:
      - Lewisham-DC_26_142577
      - Lewisham-DC_24_134407
      - Lewisham-DC_24_134442
      - Lewisham-DC_24_134455
      - Lewisham-DC_24_137303
      - Lewisham-DC_18_022222   # Under Consideration, no decision; its URL is reused by the test record TEST/18/022222 and its description is the same template text ("[(existing/proposed)]"); possibly a test record, not confirmed (findings/lewisham/url_planning_app.ipynb, Step 3)

  - id: drop_consultation_responses
    action: drop_records
    decided: 2026-11-11
    reason: >
      Not Lewisham applications: Lewisham's response when another authority consulted
      it on that authority's own application (decision No Objection to Proposal (OBS
      only), Comment Issued or Closed). The Datahub records the response with borough
      Lewisham, but the site is in the other borough and the application is counted
      there (golden rule: scope by location). Each id was confirmed against the other
      authority's record: same address, a real decision soon after Lewisham's response,
      same proposal (findings/lewisham/out_of_borough.ipynb, Steps 1, 4 and 5; read-only
      EDA exception approved by the user 2026-11-11). Only confirmed ids are listed;
      Lewisham's own opinions (EIA screening, construction hours) use the same decision
      values and are kept, so there is no condition. Unconfirmed candidates stay loaded
      (sources.yaml, consultation_responses rule for the bot). Lewisham-DC_21_122776
      (57 Cator Road) was left out: same address as a Bromley application, but a
      different description.
    ids:
