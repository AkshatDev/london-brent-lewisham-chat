      Lewisham-DC_22_129646: Approved   # portal: Decided, Granted Deemed Consent

fields:
  status:
    - id: appeal_in_progress_case
      action: map
      from: Appeal in Progress
      to: Appeal In Progress
      decided: 2026-11-11
      reason: >
        Case variant of the schema value; same rule as Brent. The 1 record with it
        (Lewisham-22_127022) is an older duplicate dropped by drop_stale_duplicates, so the
        rule matches 0 records today; kept in case the value comes back.

    - id: status_from_decision
      action: copy_when_null   # new action: clean_record does not support it yet (handover)
      from: decision
      to: status
      expected_count: 22
      decided: 2026-11-11
      reason: >
        No status but a decision: 16 PRE/ records (Comment Issued 12, Objection Raised
        to Proposal (OBS only) 2, Closed 2) and 6 DC/ records (Withdrawn 5, Approved 1,
        DC/17/099662). Every one of these decisions is also a schema status value, and
        a decided record's status normally equals its decision (15,062 Lewisham records
        have status Approved). Like any Approved status, it may since have moved on
        (Completed, Lapsed) without the Datahub knowing. Runs after
        outcome_from_portal and before empty_to_unknown. New for Lewisham: Brent never
        had a record with a decision and no status
        (findings/lewisham/status.ipynb, Step 3).

    - id: empty_to_unknown
      action: fill_null
      to: Unknown
      decided: 2026-11-11
      reason: >
        No status recorded; Unknown is a schema value. After the rules above, 3
        records: the ones Lewisham's portal could not resolve either (DC/21/122223,
        DC/26/143311, DC/24/138293; sources.yaml, portal_same_gap).

  decision:
    - id: not_required_case
      action: map
      from: Not required
      to: Not Required
      decided: 2026-11-11
      reason: >
        Case variant of the schema value (1 record, Lewisham-DC_15_09720, whose status
        is already Not Required; findings/lewisham/decision.ipynb, Step 2).

  site_number:
    - id: site_number_as_text
      action: to_text
      decided: 2026-11-11
      reason: >
        Same as Brent. The schema type is string, but 1,568 values come as JSON numbers
        and 2,243 as digit strings; 224 numbers arrive both ways (2 and "2"). Store every
        value as text, numbers without a decimal part (2 -> "2"), so 2 and "2" are the
        same value (findings/lewisham/address.ipynb, Steps 1 and 3).

  locality:
    - id: locality_null_text
      action: map
      from: "NULL"
      to: null
      decided: 2026-11-11
      reason: >
        6 records have the text "NULL" in locality: a placeholder, not a place. Without
        this rule the bot could show "NULL" as part of an address
        (findings/lewisham/address.ipynb, Step 3).

derived:
  - id: address
    action: derive
    columns: [address, address_kind]
    from: [site_name, site_number, street_name, locality, postcode]
    decided: 2026-11-11
    address_kind: >
      As Brent's derived rule "address" (same order of kinds): missing, number_only,
      street_record, with_full_postcode, several_parts, one_part.
    address: >
      As Brent's: with_full_postcode, several_parts, street_record: address = site_name.
      number_only, one_part, missing: join site_name, site_number (only if different
      from site_name), street_name, locality and postcode with ", ", skipping empty
      parts. The field rules on the address parts (locality_null_text) run first.
    reason: >
      site_name is a full address for about 81% of records; where it is a number only,
      one part or missing (3,787), the other fields complete it for 3,777. One column
      means the bot can't pick the wrong field (address.yaml;
      findings/lewisham/address.ipynb).

  - id: legacy_record
    action: derive
    columns: [legacy_record]
    from: [bo_system]
    when_equals: {bo_system: FME Legacy Data Import}   # read by clean_record
    decided: 2026-11-11
    rule: legacy_record = true when bo_system is "FME Legacy Data Import", else false.
    reason: >
      Legacy records (4,312) never have valid_date, decision_target_date or
      url_planning_app; the flag lets the bot explain the empty fields instead of
      treating them as gaps. Only FME Legacy Data Import is legacy: the 33 records with
      bo_system Portal are ordinary applications (findings/lewisham/bo_system.ipynb).

# No rule, on purpose:
#   - status "Historical" (Lewisham-95_038596 only): kept as the Datahub publishes it
#     (decision Refused, 30/10/1996). The portal shows Decided, decision "Created during
#     migration", validated 28/11/2023 (checked by a person 2026-11-11). The bot's
#     context for it is a known issue in status.yaml.
#   - Unconfirmed consultation responses (borough Lewisham, site in another borough):
#     no condition separates them from Lewisham's own opinions, so only confirmed ids
#     are dropped (drop_consultation_responses); the bot is told how to treat one whose
#     site is outside Lewisham.
