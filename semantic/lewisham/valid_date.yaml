# Field facts for the chat bot, Lewisham only (golden rule). Describes the data after cleaning.yaml.
field: valid_date
web_label: Valid date
meaning: >
  The date the application became valid. "Validated in <year>" means valid_date in
  that year. Recorded from 2019 on; missing for all legacy records (bo_system FME
  Legacy Data Import).
schema_definition: Contains the date at which the application is valid (DD/MM/YYYY)
format: date   # the Datahub sends DD/MM/YYYY text; cleaning reads it as a date

checks_passed:
  - All filled values are valid DD/MM/YYYY dates (no blanks, no other characters),
    from 14/09/2010 to 06/11/2026; none in the future.
  - No placeholder dates (the most common date is used 43 times).

known_issues:
  - id: starts_2019
    description: >
      Only 15 records have a valid_date before 2019; from 2019 on, 2,000-4,213 a
      year. Older applications have none.

  - id: missing_valid_date
    count: 4361
    description: >
      Legacy records (4,312) never have a valid_date. The other 49 are decided
      applications (48 Approved, 1 Refused) that also have no URL and no target date:
      25 from the CSV import (20 of them Prior Approvals approved 2022-2025) and 24 of
      the 33 records with bo_system Portal. Why is not known.

  - id: valid_after_decision
    count: 14
    description: >
      valid_date is after decision_date, which cannot be right for a real
      application. 11 are within a year (7 Withdrawn). 3 are years apart:
      Lewisham-95_038596 (decided 1996, valid 2023, the portal says "Created during
      migration"), Lewisham-DC_13_082322_X (decided 2013, valid 2025; the portal shows
      the same validated date) and Lewisham-DC_21_122222 (decided 2021, valid 2023, not
      checked). The dates are kept as published.

rules:
  - A missing valid_date does not mean the application is new or pending.
  - Counts or trends by valid_date cover 2019 on only and leave out the legacy records.
    For earlier years use decision_date, say which date was used, and say that
    Lewisham's records before 2019 are far from complete (decision_date.yaml,
    thin_before_2019).
  - Give a decision time (valid_date to decision_date) only where decision_date is on or
    after valid_date. Otherwise say the recorded valid date is later than the decision
    and cannot be used for timing.

checked:
  date: 2026-11-11
  source: live API (findings/lewisham/valid_date.ipynb, Steps 1-5); knowledge/lewisham_portal_checks.md
