# Field facts for the chat bot, Brent only (golden rule). Describes the data after cleaning.yaml.
field: appeal_decision
web_label: Appeal decision
meaning: >
  Outcome of an appeal against the council's decision, decided by the Planning
  Inspectorate. Set once and not overwritten, unlike status. Null means no appeal was
  decided (most applications are never appealed).
schema_definition: >
  Describes the decision of the appeal made by the planning inspectorate, see Field
  Values tab for all appeal decision types
format: text

# Values after cleaning (2026-11-10 snapshot).
values:
  - Dismissed        # 729
  - Allowed          # 493
  - Withdrawn        # 43
  - Split Decision   # 24
values_not_in_schema: []   # ZZZ (deleted appeal record) becomes NULL at load

schema_values_never_seen:
  - Appeal In Progress
  - Quashed
  - Appeal Closed

checks_passed:
  - Every filled value is a string; no case or whitespace variants.
  - Filled together with appeal_decision_date, except Brent-20_4264 (see
    appeal_from_portal).
  - Never contradicts status (status Allowed / Dismissed / Split Decision always has the
    same appeal_decision).

known_issues:
  - id: deleted_appeal_record
    count: 16
    description: >
      The Datahub sends ZZZ for an appeal record that was deleted (portal: "Technically
      Deleted Record"). Not an appeal outcome: appeal_decision and appeal_decision_date
      are NULL at load and appeal_record_deleted = true (open question 2).

  - id: appeal_from_portal
    count: 1
    description: >
      Brent-20_4264: appeal_decision Allowed comes from Brent's portal ("Appeal
      decided, Appeal Allowed", checked by a person 2026-11-10); the Datahub had no
      appeal data and still said Application Received. No council decision and no
      appeal date are known (likely an appeal against non-determination).
      outcome_source = portal_manual_check.

  - id: withdrawn_appeal
    count: 43
    description: >
      A withdrawn appeal leaves the council's decision standing; 11 of these now have
      status Refused.

rules:
  - '"How many appeals were allowed / dismissed?" uses appeal_decision, not status.'
  - Appeals still running are not here; they show in status (Appeal Received, Appeal
    In Progress). Brent-96_1985 (1996, Appeal In Progress) is status_stale, and no
    source has its outcome.
  - appeal_record_deleted = true means an appeal was entered and then deleted (the
    Datahub's ZZZ). There is no appeal outcome; never count it as an appeal.
  - The council's original decision is in decision; appeal_decision does not change it.

checked:
  date: 2026-11-10
  source: live API; recounted on the cleaned database (core.applications)
