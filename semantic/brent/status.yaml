# Field facts for the chat bot, Brent only (golden rule). Describes the data after cleaning.yaml.
field: status
web_label: Status
meaning: >
  Current stage or outcome of the application, overwritten as it moves on (no history
  in the API). Mixes stages (Application Received, Commenced, Completed), council
  outcomes (Approved, Refused, Withdrawn) and appeal outcomes (Allowed, Dismissed).
  The council's original decision is a separate field: decision.
schema_definition: >
  Describes the current status of the application, see Field Values tab for all
  Status Types
format: text

# Values after cleaning (case variants merged, empty -> Unknown, ZZZ -> Refused), 2026-11-10 snapshot.
values:
  - Approved
  - Refused
  - Completed
  - Lapsed
  - Withdrawn
  - Dismissed
  - Superseded
  - Application Received
  - Unknown
  - Allowed
  - Commenced
  - Application Under Consideration
  - Appeal Received
  - Closed
  - Split Decision
  - Application Invalid
  - No Objection to Proposal (OBS only)
  - Appeal In Progress
  - Objection Raised to Proposal (OBS only)
values_not_in_schema: []   # ZZZ (deleted appeal record) becomes Refused at load

schema_values_never_seen:
  - Called in by Secretary of State
  - Comment Issued
  - Declined to Determine
  - Insufficient Fee
  - Not Required
  - Opinion Issued
  - Pending Legacy Record
  - Pre-application Advice Case Completed
  - Quashed
  - Referred to Mayor
  - Revoked

known_issues:
  - id: deleted_appeal_record
    count: 16
    description: >
      The Datahub sends status ZZZ for 16 refused applications whose appeal record was
      deleted (portal: Appeal Decision "Technically Deleted Record"). Loaded as
      Refused, with appeal_record_deleted = true (deleted_appeal in cleaning.yaml;
      open question 2).

  - id: unknown_status
    count: 1
    description: >
      Brent-18_3324: status and decision empty in the source; Brent's planning portal
      says Decided (10/03/2020) but shows no decision either. 9 other records had the
      same gap; their outcome was read from the portal by a person and filled in
      (outcome_source = portal_manual_check; open question 9).

  - id: under_consideration_but_approved
    count: 2
    description: >
      status = Application Under Consideration but decision = Approved, no decision_date:
      Brent-25_3290, Brent-26_1174. The status is right: Brent's planning portal shows
      both "Awaiting decision", subject to a Section 106 agreement not yet signed
      (checked 2026-11-10). Flagged decision_not_issued = true (open question 4).

  - id: stale_pending
    count: 33
    description: >
      status Application Received or Application Under Consideration, no
      decision_date, decision_target_date more than a year before the snapshot:
      status_stale = true. The Datahub stopped updating them (32 of the first 35 not
      updated for over a year); 3 checked on Brent's portal had moved on (approved;
      appeal allowed; page removed). The 2 with a known outcome are filled from the
      portal (outcome_source = portal_manual_check), so 33 remain flagged
      (open question 5).

  - id: lapsed_not_only_approvals
    count: 35
    description: >
      35 records with status Lapsed have decision = Refused (of 1,826 Lapsed with a
      decision). lapsed_date (not loaded) is always decision_date + 3 years, whatever
      the decision, so status Lapsed does not show that a permission existed.

  - id: stale_appeal_in_progress
    count: 1
    description: >
      Brent-96_1985, a 1996 application, still has status Appeal In Progress. Brent's
      own portal also still says "Appeal lodged" with no appeal decision (checked
      2026-11-10): Brent's system was never updated, and no source has the outcome.
      Flagged status_stale = true (open question 5).

rules:
  - status_stale = true means the status is probably out of date. Don't report the
    application as pending or count it as pending; say the record hasn't been
    updated and give url_planning_app.
  - For "was it refused by the council?", read decision, not status.
  - Count appeal outcomes from appeal_decision, not status. status moves on after an
    appeal (e.g. to Completed or Lapsed); only 243 of 493 allowed appeals still have
    status Allowed.
  - Appeals still running show only in status (Appeal Received, Appeal In Progress);
    they have no appeal_decision yet.

checked:
  date: 2026-11-10
  source: live API; recounted on the cleaned database (core.applications)
